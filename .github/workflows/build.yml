name: Build

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Préparer l'environnement
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer le build
        run: npm run build

      - name: Vérifier que le build existe
        run: |
          if [ ! -f dist/calc.js ]; then
            echo "::error::Le build n'a produit aucun fichier dans dist/"
            exit 1
          fi
          echo "Build OK : dist/calc.js est bien présent"

      - name: Sauvegarder dist/ comme artefact
        uses: actions/upload-artifact@v7
        with:
          name: application
          path: dist/

      - name: Écrire le résumé du build
        if: always()
        run: |
          echo "## Résumé du build" >> $GITHUB_STEP_SUMMARY
          echo "- **Statut** : ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit** : ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branche** : ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Lancé par** : ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Date** : $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
