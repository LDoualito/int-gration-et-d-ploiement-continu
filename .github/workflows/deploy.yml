name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnemment cible"
        type: choice
        required: true
        options:
          - staging
          - production
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: installer les dépendances
        run: npm ci

      - name: Lancer le build
        run: npm run build

      - name: Publier le build comme artefact
        uses: actions/upload-artifact@v7
        with:
          name: application
          path: dist/
  test:
    needs: build
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        node: [20, 22]
        os: [ubuntu-latest, windows-latest,]
    steps:
      - name: Checkout du code
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{matrix.node}}
      
      - name : Recuperer l'artefact du build
        uses: actions/download-artifact@v7
        with:
          name: application
          path: dist/

      - name: Lancer les tests
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Recuperer l'artefact du build
        uses: actions/download-artifact@v7
        with:
          name: application
          path: dist/
      
      - name : Afficher l'URL de l'API
        run : echo "Deploiement vers ${{ vars.API_URL }}"

      - name: Ecrire le resume du deploiement
        run: |
          echo "## Résumé du déploiement" >> $GITHUB_STEP_SUMMARY
          echo "- **Cible** : ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL** : ${{ vars.API_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Statut** : ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit** : ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branche** : ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Lancé par** : ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Date** : $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
    